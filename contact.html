<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment | MD Badhon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <!-- আপনার দেওয়া ইমেজ লিঙ্কটি ফেভিকন হিসেবে সেট করা হয়েছে -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/XJhnYLg5/Asset-11.png">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background-color: #050505; 
            color: #ffffff;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bg-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.15) 0%, transparent 70%);
            z-index: -1;
            filter: blur(80px);
        }

        .form-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 18px;
            border-radius: 14px;
            color: white;
            outline: none;
            transition: 0.3s ease;
            width: 100%;
            font-size: 14px;
        }
        .form-input:focus { 
            border-color: #14b8a6; 
            background: rgba(20, 184, 166, 0.05);
            box-shadow: 0 0 15px rgba(20, 184, 166, 0.2);
        }

        /* Webkit calendars appearance fix */
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Background Glows -->
    <div class="bg-glow top-10 left-10"></div>
    <div class="bg-glow bottom-10 right-10"></div>

    <!-- Navigation Header -->
    <nav class="w-full py-4 px-4 md:px-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center glass-card rounded-2xl px-5 py-3">
            <a href="/">
                <img src="https://i.postimg.cc/XJhnYLg5/Asset-11.png" alt="Logo" class="h-8 md:h-10 w-auto">
            </a>
            <div class="flex items-center gap-6 text-[10px] font-bold uppercase tracking-[0.2em]">
                <a href="/" class="text-gray-400 hover:text-teal-400 transition">← Back to Portfolio</a>
            </div>
        </div>
    </nav>

    <!-- Main Booking Section -->
    <section class="max-w-4xl mx-auto px-6 py-12 md:py-20">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-6xl font-bold tracking-tighter mb-4">
                Schedule a <span class="text-teal-500">Session</span>
            </h1>
            <p class="text-gray-400 text-sm md:text-base max-w-md mx-auto">
                Select a convenient date and time to discuss your industrial automation, PLC logic, or smart factory requirements.
            </p>
        </div>

        <!-- Booking Form Card -->
        <div class="glass-card rounded-[40px] p-8 md:p-12 border border-white/10 shadow-2xl">
            <form id="bookingForm" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Full Name -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-teal-400 mb-2">Full Name</label>
                        <input type="text" id="name" required placeholder="John Doe" class="form-input">
                    </div>
                    <!-- Email Address -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-teal-400 mb-2">Email Address</label>
                        <input type="email" id="email" required placeholder="john@example.com" class="form-input">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Choose Service -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-teal-400 mb-2">Select Service</label>
                        <select id="service" required class="form-input text-gray-300">
                            <option value="" disabled selected>Choose a service...</option>
                            <option value="PLC Programming & Logic">PLC Programming & Logic</option>
                            <option value="HMI/SCADA Design">HMI / SCADA Design</option>
                            <option value="VFD & Motor Control Setup">VFD & Motor Control Setup</option>
                            <option value="Industry 4.0 Consulting">Industry 4.0 Consultation</option>
                            <option value="General Technical Discussion">General Project Discussion</option>
                        </select>
                    </div>
                    <!-- Company / Project Name -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-teal-400 mb-2">Company / Project (Optional)</label>
                        <input type="text" id="company" placeholder="e.g., Smart Factory Project" class="form-input">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Preferred Date -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-teal-400 mb-2">Preferred Date</label>
                        <input type="date" id="date" required class="form-input">
                    </div>
                    <!-- Preferred Time Slot -->
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-teal-400 mb-2">Preferred Time Slot</label>
                        <input type="time" id="time" required class="form-input">
                    </div>
                </div>

                <!-- Short Project Description -->
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-teal-400 mb-2">Briefly describe your requirements</label>
                    <textarea id="notes" rows="4" placeholder="Share any specifics about hardware, systems, or challenges..." class="form-input resize-none"></textarea>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit" class="w-full bg-teal-500 text-black font-bold py-4 rounded-xl hover:bg-white transition duration-500 text-xs uppercase tracking-[0.2em]">
                        Confirm Appointment Booking
                    </button>
                </div>
            </form>
        </div>
    </section>

    <!-- Footer -->
    <footer class="text-center pb-12 text-[10px] text-gray-600 uppercase tracking-[0.5em]">
        &copy; 2026 Badhon — Engineered with Passion
    </footer>

    <!-- Form Handling Javascript -->
    <script>
    // EmailJS Initialize
    emailjs.init({
        publicKey: "is74_TyfZ2fUu6OC_",
    });

    // Restrict past dates
    const dateInput = document.getElementById("date");
    const today = new Date().toISOString().split("T")[0];
    dateInput.min = today;

    // Booking Form Submit
    document.getElementById("bookingForm").addEventListener("submit", function (e) {
        e.preventDefault();

        const params = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            service: document.getElementById("service").value,
            company: document.getElementById("company").value,
            date: document.getElementById("date").value,
            time: document.getElementById("time").value,
            notes: document.getElementById("notes").value,
            to_email: "mdbadhon7734@gmail.com"
        };

        const btn = this.querySelector("button[type='submit']");
        btn.disabled = true;
        btn.innerHTML = "Submitting...";

        emailjs.send(
            "service_bcrryui",
            "template_bev1z4j",
            params
        ).then(function () {

            alert("✅ Appointment booked successfully!");

            document.getElementById("bookingForm").reset();

            btn.disabled = false;
            btn.innerHTML = "Confirm Appointment Booking";

        }).catch(function (error) {

            console.log(error);

            alert("❌ Failed to send booking request!");

            btn.disabled = false;
            btn.innerHTML = "Confirm Appointment Booking";

        });

    });
</script>
</body>
</html>
